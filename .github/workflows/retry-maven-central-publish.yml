name: Retry Maven Central Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to republish (for example, v0.11.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout retry tools
        uses: actions/checkout@v4
        with:
          path: retry-tools
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: release
          ref: ${{ inputs.release_tag }}

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        working-directory: release
        run: |
          version=$(jq -er '."."' .github/.release-please-manifest.json)
          if [ "$RELEASE_TAG" != "v${version}" ]; then
            echo "Release tag must be v${version}." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" ]; then
            echo "Checked out commit does not match ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Maven 3.10 adds local metadata to the Central bundle, which Central rejects.
        run: ../retry-tools/mvnw deploy -DskipTests -P release
        working-directory: release
